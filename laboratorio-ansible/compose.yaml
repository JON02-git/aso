name: lab-ansible

services:
  control:
    build: .
    image: ubuntu-ssh
    container_name: control
    hostname: control
    volumes:
      - home-control:/home/ubuntu
    networks:
      - ansible-net

  web1:
    build: .
    image: ubuntu-ssh
    container_name: web1
    hostname: web1
    networks:
      - ansible-net

  web2:
    build: .
    image: ubuntu-ssh
    container_name: web2
    hostname: web2
    networks:
      - ansible-net

  db1:
    build: .
    image: ubuntu-ssh
    container_name: db1
    hostname: db1
    networks:
      - ansible-net

  db2:
    build: .
    image: ubuntu-ssh
    container_name: db2
    hostname: db2
    networks:
      - ansible-net

networks:
  ansible-net:
    external: true

volumes:
  home-control:
